{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>SecureBank - Login</title>

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

</head>

<body>

{% include 'navbar.html' %}

<section class="auth-page">


    <!-- login.jpg -->

    <div class="auth-image">

        <img src="{% static 'images/login.jpg' %}"
             alt="Bank Security">

        <h1>
            Your Security
            <br>
            Our Priority
        </h1>

        <p>
            Log in to access your account
            and manage your finances safely.
        </p>

    </div>


    <!-- LOGIN FORM -->

    <div class="form-box">

        <h2>
            🏦 SecureBank
        </h2>

        <h1>
            Login
        </h1>


        <form>

            <input
                type="email"
                placeholder="📧 Email address"
            >


            <input
                type="password"
                placeholder="🔒 Password"
            >


            <button type="submit">

                Login

            </button>

        </form>


        <p>

            Don't have an account?

            <a href="/register/">
                Register
            </a>

        </p>

    </div>

</section>

</body>

</html>
